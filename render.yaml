# Ment Platform — Render Blueprint
# Deploy: https://dashboard.render.com/blueprint/new?repo=https://github.com/Beknazar007/ment-bek

databases:
  - name: ment-db
    plan: free
    databaseName: ment
    user: ment

services:
  # ── REST API (Express + Prisma) ──────────────────────────────────────────
  - type: web
    name: ment-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ment-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_EXPIRES
        value: 7d
      - key: FRONTEND_URL
        fromService:
          type: web
          name: ment-frontend
          envVarKey: RENDER_EXTERNAL_URL

  # ── React SPA (Create React App) ─────────────────────────────────────────
  - type: web
    name: ment-frontend
    runtime: static
    rootDir: frontend-app
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: ment-api
          envVarKey: RENDER_EXTERNAL_URL
